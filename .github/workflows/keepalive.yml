name: Supabase keep-alive

# Supabase 무료 플랜은 일정 기간 요청이 없으면 프로젝트가 일시정지됩니다.
# 하루에 한 번 가벼운 조회(shops 1건)를 보내 활동 상태를 유지합니다.
on:
  schedule:
    - cron: "17 3 * * *" # 매일 03:17 UTC (한국 시간 12:17)
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY secret is not set"
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 5 --max-time 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "${SUPABASE_URL%/}/rest/v1/shops?select=id&limit=1")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Keep-alive query failed (HTTP $status)"
            exit 1
          fi
